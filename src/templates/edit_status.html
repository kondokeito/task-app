{% extends "layout.html" %}
{% block content %}
<h2 class="mt-4 mb-3">ステータス編集</h2>
<form action="{{ url_for('update_status', id=status.status_id) }}" method="post">
    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>項目名</th>
                    <th>値</th>
                </tr>
            </thead>
            <tbody class="table-group-divider">
                <tr>
                    <th>ステータス名</th>
                    <td>
                        <input type="text" class="form-control" name="status_name"
                            value="{{ status.status_name or '' }}" required>
                    </td>
                </tr>
                <tr>
                    <th>親タグ名</th>
                    <td>
                        <select class="form-select" aria-label="Default select example" name="tag_id">
                            <option value="" {% if not status.tag_id %}selected{% endif %}>なし</option>
                            {% for tag in tags %}
                            <option value="{{ tag.tag_id }}" {% if tag.tag_id==status.tag_id %}selected{% endif %}>
                                {{ tag.tag_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('option') }}" class="btn btn-outline-secondary">設定に戻る</a>
        <button type="submit" class="btn btn-primary">更新</button>
        <a href="{{ url_for('delete_status', id=status.status_id) }}" class="btn btn-danger">削除</a>
    </div>
</form>
{% endblock %}
