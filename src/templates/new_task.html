{% extends "layout.html" %}
{% block content %}
<h2 class="mt-4 mb-3">CreateTask</h2>
<form action="{{ url_for('create_task') }}" method="post">
    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>項目名</th>
                    <th>値</th>
                </tr>
            </thead>
            <tbody class="table-group-divider">
                <tr>
                    <th>タスク名</th>
                    <td><input type="text" class="form-control" name="task_name" value="" required></td>
                </tr>
                <tr>
                    <th>グループ名</th>
                    <td>
                        <select class="form-select" aria-label="Default select example" name="group_id">
                            <option value="">なし</option>
                            {% for group in groups %}
                            <option value="{{group.group_id}}">{{group.group_name}}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>タグ名</th>
                    <td>
                        <select class="form-select" aria-label="Default select example" name="tag_id">
                            <option value="">なし</option>
                            {% for tag in tags %}
                            <option value="{{tag.tag_id}}">{{tag.tag_name}}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>ステータス名</th>
                    <td>
                        <select class="form-select" aria-label="Default select example" name="status_id">
                            <option value="">なし</option>
                            {% for status in statuses %}
                            <option value="{{status.status_id}}">{{status.status_name}}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>日時</th>
                    <td><input type="datetime-local" class="form-control" id="datetime_input" name="datetime" value="">
                    </td>
                </tr>
                <tr>
                    <th>繰り返し条件(cron式)</th>
                    <td><input type="text" class="form-control" id="repetition_input" name="repetition" value=""></td>
                </tr>
                <tr>
                    <th>通知のタイミング</th>
                    <td><input type="text" class="form-control" id="remind_input" name="remind_offset_minutes" value="">
                    </td>
                </tr>
                <tr>
                    <th>備考</th>
                    <td><textarea class="form-control" rows="3" name="note"></textarea></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('main') }}" class="btn btn-outline-secondary">一覧に戻る</a>
        <button type="submit" class="btn btn-primary">保存</button>
    </div>
</form>


<!-- 下記scriptはGeminiによって作成されたもの -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const datetimeInput = document.getElementById('datetime_input');
        const repetitionInput = document.getElementById('repetition_input');
        const remindInput = document.getElementById('remind_input');

        function toggleInputs() {
            const isEmpty = (datetimeInput.value === '');

            repetitionInput.disabled = isEmpty;
            remindInput.disabled = isEmpty;

            if (isEmpty) {
                repetitionInput.value = '';
                remindInput.value = '';
            }
        }

        datetimeInput.addEventListener('input', toggleInputs);

        toggleInputs();
    });
</script>
{% endblock %}
