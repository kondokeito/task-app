<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flask - paiza{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% block style %}{% endblock %}

    <!-- 下記scriptはGeminiによって作成されたもの -->
    <script>
        (function () {
            const getSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const targetTheme = localStorage.getItem('theme') || getSystemTheme();
            document.documentElement.setAttribute('data-bs-theme', targetTheme);
        })();
    </script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="py-3 bg-primary text-light">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="{{ url_for('main') }}" class="text-decoration-none fw-bold fs-3 text-white">
                <i class="bi bi-check2-circle"></i> タスク管理
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="{{ url_for('option') }}" class="btn btn-outline-light"><i class="bi bi-gear-fill"></i></a>

                <button type="button" class="btn btn-outline-light" id="theme-toggle" aria-label="テーマ切り替え">
                    <i class="bi bi-sun-fill" id="theme-icon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container my-3">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-secondary text-light border-top py-3 mt-auto">
        <div class="container text-center">
            &copy; 2026 KeitoKondo
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- アイコン更新およびイベントリスナーの設定 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');

            const updateIcon = (theme) => {
                if (themeIcon) {
                    themeIcon.className = theme === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
                }
            };

            // 初期アイコン状態の設定
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            updateIcon(currentTheme);

            // 切り替えイベント
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const activeTheme = document.documentElement.getAttribute('data-bs-theme');
                    const nextTheme = activeTheme === 'dark' ? 'light' : 'dark';

                    document.documentElement.setAttribute('data-bs-theme', nextTheme);
                    localStorage.setItem('theme', nextTheme);
                    updateIcon(nextTheme);
                });
            }
        });
    </script>
</body>

</html>
