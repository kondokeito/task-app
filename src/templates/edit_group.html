{% extends "layout.html" %}
{% block content %}
<h2 class="mt-4 mb-3">グループ編集</h2>
<form action="{{ url_for('update_group', id=group.group_id) }}" method="post">
    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>項目名</th>
                    <th>値</th>
                </tr>
            </thead>
            <tbody class="table-group-divider">
                <tr>
                    <th>グループ名</th>
                    <td>
                        <input type="text" class="form-control" name="group_name" value="{{ group.group_name or '' }}"
                            required>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('option') }}" class="btn btn-outline-secondary">設定に戻る</a>
        <button type="submit" class="btn btn-primary">更新</button>
        <a href="{{ url_for('delete_group', id=group.group_id) }}" class="btn btn-danger">削除</a>
    </div>
</form>
{% endblock %}
